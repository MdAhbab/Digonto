# Digonto production stack. Driven by run_onVM.py.
#
# The web client is NOT here: it is built to static files and served by nginx on
# the host, which removes a long-running Node process and a class of failure.
#
# Every service binds to 127.0.0.1 only. Docker's published-port rules bypass
# ufw, so binding to the loopback interface is what actually keeps Redis,
# Qdrant and Ollama off the public internet, not the firewall.

name: digonto

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      APP_ENV: production
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - appdata:/data
    depends_on:
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
      ollama: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz',timeout=4).status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env.production]
    # Crawling, diffing, embedding, the agent runtime and the learning job all
    # run here so a slow crawl can never block an HTTP request.
    command: ["python", "-m", "app.workers.main"]
    volumes:
      - appdata:/data
    depends_on:
      api: {condition: service_healthy}
    logging: *logging

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      # Models stay resident. Reloading per request would dominate latency on a
      # CPU-only machine, and a cold load of gemma4:e2b is measured in seconds.
      OLLAMA_KEEP_ALIVE: "30m"
      # Two, and the count is deliberate: gemma4:e2b for generation and bge-m3
      # for embeddings are both on the hot path of a single question, so evicting
      # one to load the other would thrash on every query. The previous comment
      # here said "one model" while this said two, which is the kind of
      # disagreement that makes a memory budget impossible to reason about.
      OLLAMA_MAX_LOADED_MODELS: "2"
      # One slot per model, not two. Ollama sizes the KV cache per parallel slot,
      # so NUM_PARALLEL=2 doubled the cache for no throughput gain on a CPU-only
      # box where decode is memory-bandwidth bound and two concurrent
      # generations simply halve each other's speed. Requests queue instead.
      OLLAMA_NUM_PARALLEL: "1"
      # Backstop for the per-call `num_ctx` the API sends (app/llm/router.py).
      # Any client that forgets to ask gets a sane window rather than the
      # model's advertised 131,072, whose KV cache would not fit beside the
      # weights on this machine.
      OLLAMA_CONTEXT_LENGTH: "8192"
      # Flash attention plus a quantised KV cache cut cache memory roughly in
      # half, which is what buys the headroom for two resident models.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    deploy:
      resources:
        limits:
          memory: 10G
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant:/qdrant/storage
    logging: *logging

  backup:
    # Litestream streams the SQLite files continuously, so recovery does not
    # depend on a nightly dump window. Configure a destination in
    # backend/litestream.yml; with none set it runs as a no-op.
    image: litestream/litestream:latest
    restart: unless-stopped
    command: ["replicate", "-config", "/etc/litestream.yml"]
    volumes:
      - appdata:/data
      - ./backend/litestream.yml:/etc/litestream.yml:ro
    depends_on:
      api: {condition: service_healthy}
    logging: *logging

volumes:
  appdata:
  ollama:
  redis:
  qdrant:
