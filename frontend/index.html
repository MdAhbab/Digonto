    <!-- Structured data: Organization -->

      {
        "@context": "https://schema.org",

    <!-- Structured data: WebSite + SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Digonto",
        "url": "https://digonto.ahbab.dev/",
        "inLanguage": ["bn", "en"],
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://digonto.ahbab.dev/ask?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Structured data: FAQPage (general, source-checkable guidance — not Digonto-specific claims) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "ছাত্র ভিসা প্রত্যাখ্যান হওয়ার সাধারণ কারণ কী কী?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "সবচেয়ে সাধারণ কারণগুলোর মধ্যে আছে অপর্যাপ্ত আর্থিক সচ্ছলতার প্রমাণ, অস্পষ্ট বা অসামঞ্জস্যপূর্ণ পড়াশোনার পরিকল্পনা, দেশে ফেরার সংযোগ প্রমাণে ঘাটতি, এবং অসম্পূর্ণ বা অসামঞ্জস্যপূর্ণ কাগজপত্র। প্রকৃত প্রত্যাখ্যানের হার দেশ, দূতাবাস ও সময়ের সাথে ব্যাপকভাবে পরিবর্তিত হয়, তাই সংশ্লিষ্ট দূতাবাসের সাম্প্রতিক সরকারি পরিসংখ্যান যাচাই করা উচিত।"
            }
          },
          {
            "@type": "Question",
            "name": "স্টাডি অ্যাব্রড কনসালটেন্সি ফি সাধারণত কেমন হয়, এবং কীভাবে যাচাই করব?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "কনসালটেন্সি ফি প্রতিষ্ঠান, দেশ ও সেবার পরিধি অনুযায়ী ব্যাপকভাবে পরিবর্তিত হয়, তাই কোনো একক সংখ্যা নির্ভরযোগ্য নয়। ভর্তি ও ভিসা আবেদনের সরকারি ফি সবসময় সংশ্লিষ্ট বিশ্ববিদ্যালয় বা দূতাবাসের অফিসিয়াল ওয়েবসাইটে যাচাই করুন, এবং কোনো কনসালটেন্সিকে অর্থ দেওয়ার আগে তাদের চার্জের একটি লিখিত ভাঙন (breakdown) চেয়ে নিন।"
            }
          },
          {
            "@type": "Question",
            "name": "বৃত্তি ও তহবিলের উৎস কোথায় খুঁজব?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "নির্ভরযোগ্য শুরুর বিন্দু হলো লক্ষ্য বিশ্ববিদ্যালয়ের নিজস্ব বৃত্তি পাতা, সংশ্লিষ্ট দেশের সরকারি বৃত্তি বোর্ড (যেমন Chevening, Erasmus+, DAAD, Commonwealth Scholarships), এবং বাংলাদেশ সরকারের শিক্ষা মন্ত্রণালয় ও সংশ্লিষ্ট অধিদপ্তরের ঘোষণা। প্রতিটি সুযোগের যোগ্যতা ও সময়সীমা মূল উৎসে গিয়ে নিশ্চিত করা জরুরি।"
            }
          },
          {
            "@type": "Question",
            "name": "স্টাডি অ্যাব্রড ভিসা আবেদনের জন্য সাধারণত কোন কোন কাগজপত্র লাগে?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "সাধারণত পাসপোর্ট, একাডেমিক সার্টিফিকেট ও ট্রান্সক্রিপ্ট, ভাষা দক্ষতার স্কোর (যেমন IELTS), বিশ্ববিদ্যালয়ের অফার বা ভর্তি পত্র, আর্থিক সচ্ছলতার প্রমাণ (ব্যাংক স্টেটমেন্ট বা স্পন্সরশিপ লেটার), উদ্দেশ্য বিবৃতি (SOP), পাসপোর্ট সাইজ ছবি এবং ভিসা আবেদন ফর্ম প্রয়োজন হয়। প্রতিটি দেশ ও দূতাবাসের নির্দিষ্ট চাহিদা আলাদা হতে পারে, তাই সবশেষে অফিসিয়াল দূতাবাস চেকলিস্ট মিলিয়ে নেওয়া আবশ্যক।"
            }
          }
        ]
      }
    </script>
